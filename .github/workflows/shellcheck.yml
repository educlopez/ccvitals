name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck *.sh

  test:
    name: Run bats tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: shellcheck

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bats (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Install bats (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install bats-core

      - name: Install bats helpers
        run: |
          mkdir -p test/lib
          git clone --depth 1 https://github.com/bats-core/bats-support.git test/lib/bats-support
          git clone --depth 1 https://github.com/bats-core/bats-assert.git test/lib/bats-assert

      - name: Install jq (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y jq

      - name: Ensure jq available (macOS)
        # jq is pre-installed on macOS runners; install only if missing
        if: matrix.os == 'macos-latest'
        run: jq --version || brew install jq

      - name: Run tests
        run: |
          # macOS ships /bin/bash 3.2; statusline.sh is invoked via `bash` inside
          # tests. On macOS we prepend /bin/bash to PATH so tests exercise the same
          # bash version that end-users have. Bats itself runs under whatever bash
          # is on PATH after that point (brew installs bash 5, which is fine).
          if [ "$(uname)" = "Darwin" ]; then
            export PATH="/bin:$PATH"
          fi
          bats test/*.bats

  bench:
    name: Render benchmark
    runs-on: ubuntu-latest
    needs: shellcheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Build temp config with all modules
        run: |
          mkdir -p /tmp/bench-config
          # Full module list from install.sh KNOWN_MODULES (21 modules)
          echo '{"modules":["directory","model","context","usage","git","rtk","codegraph","lines","mode","cost","duration","speed","vim","agent","pr","weekly","pace","cache","tools","agents","todos"]}' \
            > /tmp/bench-config/config.json

      - name: Run render benchmark (20 iterations)
        run: |
          RUNS=20
          TOTAL_NS=0

          for i in $(seq 1 $RUNS); do
            START=$(date +%s%N)
            CLAUDE_CONFIG_DIR=/tmp/bench-config bash ./statusline.sh < test/fixtures/sample-context.json > /dev/null 2>&1 || true
            END=$(date +%s%N)
            ELAPSED=$(( END - START ))
            TOTAL_NS=$(( TOTAL_NS + ELAPSED ))
          done

          MEAN_NS=$(( TOTAL_NS / RUNS ))
          MEAN_MS=$(( MEAN_NS / 1000000 ))

          echo "Benchmark results:"
          echo "  Runs       : $RUNS"
          echo "  Total (ms) : $(( TOTAL_NS / 1000000 ))"
          echo "  Mean  (ms) : $MEAN_MS"

          THRESHOLD=400
          if [ "$MEAN_MS" -gt "$THRESHOLD" ]; then
            echo "FAIL: mean render time ${MEAN_MS}ms exceeds threshold of ${THRESHOLD}ms"
            exit 1
          else
            echo "PASS: mean render time ${MEAN_MS}ms is within threshold of ${THRESHOLD}ms"
          fi
